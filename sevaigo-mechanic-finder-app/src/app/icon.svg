<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#07090C"/>
  <circle cx="64" cy="64" r="58" fill="#FF7900" opacity="0.15"/>
  
  <!-- Curved Road -->
  <path d="M32 94 C 54 84, 76 68, 102 62" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M42 98 C 64 88, 86 72, 108 66" stroke="#FF7900" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Orange Speed Dash Rays -->
  <line x1="24" y1="44" x2="42" y2="44" stroke="#FF7900" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="18" y1="52" x2="38" y2="52" stroke="#FF7900" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="28" y1="60" x2="44" y2="60" stroke="#FF7900" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Glowing Orange Map Pin with Wrench Cutout -->
  <path d="M64 20 C 49 20, 38 31, 38 46 C 38 64, 60 84, 64 88 C 68 84, 90 64, 90 46 C 90 31, 79 20, 64 20 Z" fill="url(#pinGrad)" filter="drop-shadow(0 4px 10px rgba(255,121,0,0.5))"/>

  <!-- Wrench Cutout -->
  <circle cx="64" cy="46" r="14" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="64" cy="46" r="6" fill="#07090C"/>

  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF7900"/>
    </linearGradient>
  </defs>
</svg>
